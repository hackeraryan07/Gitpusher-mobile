name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # Shallow clone for faster checkout

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # Removed 'cache: gradle' as we will use the dedicated gradle action.

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        # Only write to the cache on the main branches to avoid cache thrashing from PRs
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

    - name: Make gradlew executable
      run: chmod +x ./gradlew || true

    - name: Build Debug APK
      # Enabled build cache, parallel execution, configuration caching, and disabled the daemon for ephemeral CI
      run: ./gradlew assembleDebug --build-cache --parallel --configure-on-demand --no-daemon || gradle assembleDebug --build-cache --parallel --configure-on-demand --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        # Limit retention to save space and upload time overhead if any
        retention-days: 7
